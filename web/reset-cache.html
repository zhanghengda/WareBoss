<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0d7769"/>
  <title>正在修复 WareBoss 页面</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f7;color:#173b38;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.card{width:min(86vw,360px);padding:28px;border-radius:18px;background:#fff;box-shadow:0 14px 38px #0d776922;text-align:center}.mark{margin:auto auto 14px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#e1f5f0;color:#087a69;font-size:25px}h1{font-size:19px;margin:0 0 10px}p{margin:0;color:#647875;line-height:1.7;font-size:14px}.fail{margin-top:16px;color:#bd453f}</style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>正在修复页面缓存</h1>
    <p id="status">正在移除旧页面脚本缓存，库存和流水数据不会受到影响…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        status.textContent = '修复完成，正在重新打开 WareBoss…';
        setTimeout(() => location.replace('./?v=20261105.34'), 600);
      } catch (error) {
        status.className = 'fail';
        status.textContent = '缓存修复未完成，请关闭浏览器后重新打开此页面。';
      }
    })();
  </script>
</body>
</html>
